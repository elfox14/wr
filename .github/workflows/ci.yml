name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  verify:
    name: Lint, type-check, and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wr_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d wr_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wr_ci?schema=public
      NEXTAUTH_SECRET: ci-placeholder-secret
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prepare database schema
        run: npx prisma db push --skip-generate

      - name: Lint
        run: npm run lint

      - name: Lint AI analysis files
        run: npm run lint:ai

      - name: Lint asset page
        run: npm run lint:asset-page

      - name: Lint market lite
        run: npm run lint:market-lite

      - name: Lint market client
        run: npm run lint:market-client

      - name: Lint portfolio AI
        run: npm run lint:portfolio-ai

      - name: Lint team intelligence
        run: npm run lint:team-intelligence

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build
