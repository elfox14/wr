name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  verify:
    name: Lint, type-check, and build
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wr_ci?schema=public
      NEXTAUTH_SECRET: ci-placeholder-secret
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Start local PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres psql -tc "SELECT 1 FROM pg_database WHERE datname = 'wr_ci'" | grep -q 1 || sudo -u postgres createdb wr_ci
          pg_isready -h localhost -p 5432 -U postgres

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prepare database schema
        run: npx prisma db push --skip-generate

      - name: Lint
        run: npm run lint

      - name: Lint AI analysis files
        run: npm run lint:ai

      - name: Lint asset page
        run: npm run lint:asset-page

      - name: Lint market lite
        run: npm run lint:market-lite

      - name: Lint market client
        run: npm run lint:market-client

      - name: Lint portfolio AI
        run: npm run lint:portfolio-ai

      - name: Lint team intelligence
        run: npm run lint:team-intelligence

      - name: Lint navbar
        run: npm run lint:navbar

      - name: Lint team overview
        run: npm run lint:team-overview

      - name: Lint team intelligence admin
        run: npm run lint:team-intelligence-admin

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build
